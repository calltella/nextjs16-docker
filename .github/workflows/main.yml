name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          npx tsx lib/card-settings.test.ts
          npx tsx lib/date-utils.test.ts
          npx tsx lib/csv.test.ts
          npx tsx lib/string-utils.test.ts
          
      - name: Set Cloudflare Secrets (bulk)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions secret bulk <<EOF
          {
          "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
          }
          EOF

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Build Cloudflare Workers bundle
        run: npm run build:cf
