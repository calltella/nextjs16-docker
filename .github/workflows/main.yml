name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          npx tsx lib/card-settings.test.ts
          npx tsx lib/date-utils.test.ts
          npx tsx lib/csv.test.ts
          npx tsx lib/string-utils.test.ts

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build
